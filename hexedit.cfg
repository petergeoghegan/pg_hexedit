#!/bin/bash
#
# Configuration for convenience bash scripts

# Specify ImHex binary path here (uncomment and adjust), or leave IMHEX unset
# to autodetect: "imhex" on $PATH, then the macOS app bundle location.
#IMHEX="/Applications/ImHex.app/Contents/MacOS/imhex"
#IMHEX="$HOME/Applications/imhex.AppImage"

if [ -z "$IMHEX" ]; then
  if command -v imhex > /dev/null 2>&1; then
    IMHEX=imhex
  elif [ -x "/Applications/ImHex.app/Contents/MacOS/imhex" ]; then
    IMHEX="/Applications/ImHex.app/Contents/MacOS/imhex"
  else
    IMHEX=imhex
  fi
fi
export IMHEX

# Only blocks in the range $MIN_BLOCK_TAGS - $MAX_BLOCK_TAGS are fully
# annotated; other blocks only get page-header annotations.  ImHex keeps
# every annotation in memory (roughly 2MB and 35ms of evaluation per
# annotated block), so this window bounds evaluator memory usage.  Regenerate
# with a different window to inspect other parts of large relations.
#
# (Note that setting MIN_BLOCK_TAGS to anything other than 0 will prevent the
# psql remote download fallback from being used.  This is due to an
# implementation restriction that may be lifted in the future.)
export MIN_BLOCK_TAGS=0
export MAX_BLOCK_TAGS=200

# psql can pick up these environment variables (see
# https://www.postgresql.org/docs/current/static/libpq-envars.html):
export PGDATABASE="postgres"
#export PGUSER="postgres"
#export PGPASSWORD="password"
#export PGHOST=localhost
#export PGPORT=5432

# Extra flags passed to pg_hexedit (see pg_hexedit -h):
export EXTRAFLAGS=""
